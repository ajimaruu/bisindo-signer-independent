# Frame extraction preprocessing (locked 27 Oct 2026, see results/config_log.md sections 6 and 8).
# The same ffmpeg pipeline is applied to every video; HLG sources are tone-mapped,
# SDR BT.709 sources pass through the same chain unchanged in colour space.

colour:
  target: sdr_bt709
  tonemap_operator: mobius
  # Applied only when the source stream has color_transfer=arib-std-b67 (HLG).
  hlg_filter: "zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=mobius:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p"
  sdr_filter: "format=yuv420p"

sampling:
  frames_per_video: 5
  # Equally spaced over the middle 60% of the video, endpoints included:
  # positions = linspace(0.20, 0.80, 5) = 0.20, 0.35, 0.50, 0.65, 0.80.
  # Position p maps to decoded frame index round(p * (n_frames - 1)), with n_frames
  # counted by ffprobe (frame index, not timestamp, because some videos are VFR).
  start_fraction: 0.20
  end_fraction: 0.80

resize:
  long_side: 1280   # downscale only (area interpolation); 1280x720 sources stay unchanged

output:
  jpeg_qscale: 2    # ffmpeg -q:v (2 = high quality)
  # File name: s{signer}_{gloss_slug}_v{sample:02d}_f{frame:04d}.jpg, frame = 0-based decoded index.
  # gloss_slug = lower-case gloss with spaces removed (Terima kasih -> terimakasih).

annotation:
  # One box per frame, tightly enclosing the signing hand(s), labelled with the gloss name.
  # Two-handed gestures: a single box encloses both hands.
  # The face is never included in the box, even when a hand touches it.
  boxes_per_frame: 1

exclusion:
  # Locked 27 Oct 2026. Decided per frame during annotation, before any training,
  # identically for every gloss and signer. Excluded frames stay in data/frames/
  # and are listed in data/excluded_frames.csv (columns: file,reason).
  # If several apply, record the first in the order a -> b -> c.
  list_file: data/excluded_frames.csv
  reasons:
    a: hands still at rest, or not yet raised into the signing space
    b: handshape blurred by motion
    c: hands mostly outside the frame
