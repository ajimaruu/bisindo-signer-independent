# Frame extraction preprocessing (decided 27 Oct 2026, see results/config_log.md section 6).
# The same ffmpeg pipeline is applied to every video; HLG sources are tone-mapped,
# SDR BT.709 sources pass through the same chain unchanged in colour space.

colour:
  target: sdr_bt709
  tonemap_operator: mobius
  # Applied only when the source stream has color_transfer=arib-std-b67 (HLG).
  hlg_filter: >-
    zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,
    tonemap=tonemap=mobius:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p
  sdr_filter: format=yuv420p

# Still to be decided with the user before extraction:
frames_per_video: null
resize_long_side: null   # null = keep source resolution
