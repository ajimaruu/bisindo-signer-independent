# Run plans for scripts/kaggle_session.py (--plan <name>). Runs execute in order; finished runs are skipped
# and unfinished ones resume from last.pt, so the same plan can be run again in the next session.
# The batch comes from the one-off Kaggle probe (runs/kaggle_batch.json), the same for all three models.

# Pilot (28 Oct 2026): YOLO11m to early stopping, max 100 epochs, patience 20; RT-DETR-L and Faster R-CNN
# 2 epochs each, only to check the pipeline and measure the time per epoch on the Kaggle GPU.
pilot:
  - {model: yolo11m, split: p1, seed: 0, epochs: 100, patience: 20, name: pilot_yolo11m_p1_seed0}
  - {model: rtdetr-l, split: p1, seed: 0, epochs: 2, name: pilot2ep_rtdetr-l_p1_seed0}
  - {model: frcnn-r50fpn, split: p1, seed: 0, epochs: 2, name: pilot2ep_frcnn-r50fpn_p1_seed0}

# Main runs (30, locked 28 Oct 2026): P1 seed 0 then seed 1, then the LOSO folds s1-s4 (seed 0 then 1 within a
# fold); within each block YOLO11m, RT-DETR-L, Faster R-CNN. Batch, max epochs (100) and patience (20) come from
# configs/train.yaml. Run names: <model>_<split>_seed<seed> (runs/ultralytics/ or runs/frcnn/).
# Split across two platforms on 31 Oct 2026 (user's decision, time; config_log section 28): `main` (Kaggle, Tesla T4)
# holds P1 and the folds s1-s3; fold s4 runs on Google Colab (Tesla T4) as `colab_s4`, with the same scripts,
# package versions and guards. The 30 runs of the paper are main + colab_s4 (scripts/collect_results.py).
main:
  - {model: yolo11m, split: p1, seed: 0}
  - {model: rtdetr-l, split: p1, seed: 0}
  - {model: frcnn-r50fpn, split: p1, seed: 0}
  - {model: yolo11m, split: p1, seed: 1}
  - {model: rtdetr-l, split: p1, seed: 1}
  - {model: frcnn-r50fpn, split: p1, seed: 1}
  - {model: yolo11m, split: loso_s1, seed: 0}
  - {model: rtdetr-l, split: loso_s1, seed: 0}
  - {model: frcnn-r50fpn, split: loso_s1, seed: 0}
  - {model: yolo11m, split: loso_s1, seed: 1}
  - {model: rtdetr-l, split: loso_s1, seed: 1}
  - {model: frcnn-r50fpn, split: loso_s1, seed: 1}
  - {model: yolo11m, split: loso_s2, seed: 0}
  - {model: rtdetr-l, split: loso_s2, seed: 0}
  - {model: frcnn-r50fpn, split: loso_s2, seed: 0}
  - {model: yolo11m, split: loso_s2, seed: 1}
  - {model: rtdetr-l, split: loso_s2, seed: 1}
  - {model: frcnn-r50fpn, split: loso_s2, seed: 1}
  - {model: yolo11m, split: loso_s3, seed: 0}
  - {model: rtdetr-l, split: loso_s3, seed: 0}
  - {model: frcnn-r50fpn, split: loso_s3, seed: 0}
  - {model: yolo11m, split: loso_s3, seed: 1}
  - {model: rtdetr-l, split: loso_s3, seed: 1}
  - {model: frcnn-r50fpn, split: loso_s3, seed: 1}

# Fold s4 on Google Colab (scripts/colab_notebook.ipynb), same order as above.
colab_s4:
  - {model: yolo11m, split: loso_s4, seed: 0}
  - {model: rtdetr-l, split: loso_s4, seed: 0}
  - {model: frcnn-r50fpn, split: loso_s4, seed: 0}
  - {model: yolo11m, split: loso_s4, seed: 1}
  - {model: rtdetr-l, split: loso_s4, seed: 1}
  - {model: frcnn-r50fpn, split: loso_s4, seed: 1}
